[project]
name = "twin-leakage-ledger"
version = "0.2.1"
description = "Per-recipient leakage ledger for health-twin messages, tested on synthetic data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Paul Burg" }]
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
# Only for `make reproduce-llm` (GPU). torch comes from the host image; see docs/KAGGLE.md.
llm = [
    "transformers==5.20.2",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "reuse==6.2.0",
    "pip-audit==2.10.1",
]

[tool.uv]
package = false
# every resolved release is older than one month at the time of locking
exclude-newer = "2026-10-20T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
